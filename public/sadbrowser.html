<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<title>sad browser</title>
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<link rel="shortcut icon" href="/favicon.ico">

	<!--
		The one page that can't assume anything.

		It's where a browser that couldn't run the app gets sent, so it has no
		module script, no webfont, no bundle and no shared stylesheet — everything
		it needs is inline and would render in something a decade out of date.
		Do not turn it into a route: a route would need the very bundle whose
		absence sent the reader here.
	-->
	<style>
		html, body { margin: 0; padding: 0; background: #f1f1f1; }
		body {
			padding: 60px 20px;
			font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
			color: #444;
			line-height: 1.5;
		}
		.center { margin: 0 auto; max-width: 640px; }
		h1 { margin: 0 0 .5em 0; font-size: 30px; font-weight: normal; color: #222; }
		p { font-size: 15px; }
		a { color: #2a5cd0; }
	</style>
</head>
<body>
	<div class="center">
		<h1>Your browser is sad and you should be too.</h1>
		<p>
			Thumbcinema needs a browser with canvas, local storage and support for
			modern JavaScript. Update to something current and your life will
			improve. (Not a guarantee.)
		</p>
		<p><a href="/">Try the gallery anyway</a></p>
	</div>
</body>
</html>
